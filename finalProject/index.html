<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Worst Volume Control Design</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <h2>Volume Control</h2>

      <div class="stats">
        <div>
          <strong>Status:</strong>
          <span id="status">Idle.</span>
        </div>
        <div>
          <strong>Round:</strong>
          <span id="round">0</span>
        </div>
        <div>
          <strong>Countdown:</strong>
          <span id="countdown">-</span>
        </div>
        <div>
          <strong>Run score (0–100):</strong>
          <span id="bankedVolume">0</span>
        </div>
        <div>
          <strong>Output volume (0–100):</strong>
          <span id="appliedVolume">0</span>
        </div>
      </div>

      <hr />

      <div>
        <button id="btnStart">Start game</button>
        <button id="btnRestart" disabled>Restart</button>
        <button id="btnBank" disabled>Commit to output</button>
        <button id="btnContinue" disabled>Risk next round</button>
      </div>

      <hr />

      <div>
        <div><strong>Click the colors:</strong></div>
        <div>
          <button id="color-red" data-color="red">red</button>
          <button id="color-green" data-color="green">green</button>
          <button id="color-blue" data-color="blue">blue</button>
          <button id="color-yellow" data-color="yellow">yellow</button>
        </div>
      </div>

      <hr />

      <div>
        <div><strong>Output</strong></div>
        <p class="output-hint">
          Slider shows level after you commit, use the buttons to turn it down
          anytime.
        </p>
        <div class="volume-row">
          <label for="volumeSlider">Output volume (display)</label>
          <input
            type="range"
            id="volumeSlider"
            min="0"
            max="100"
            value="0"
            step="1"
            disabled
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-disabled="true"
            aria-label="Output volume 0 to 100; matches the number above when you commit, or when you use Quieter or Mute"
          />
        </div>
        <div class="output-controls">
          <button
            type="button"
            id="btnOutputQuieter"
            class="output-controls-btn"
          >
            Quieter (−10)
          </button>
          <button type="button" id="btnOutputMute" class="output-controls-btn">
            Mute output
          </button>
        </div>
      </div>
    </main>

    <script src="./index.js"></script>
  </body>
</html>
