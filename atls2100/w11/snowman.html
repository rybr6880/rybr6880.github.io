<!doctype html>
<html>
  <head>
    <title>Unreal Winter World</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity environment="preset: forest"></a-entity>

      <a-sphere position="0 0.75 -5" radius="0.75" color="#ffffff"></a-sphere>
      <a-sphere position="0 1.85 -5" radius="0.55" color="#ffffff"></a-sphere>
      <a-sphere position="0 2.7 -5" radius="0.4" color="#ffffff"></a-sphere>
    </a-scene>
  </body>
</html>
